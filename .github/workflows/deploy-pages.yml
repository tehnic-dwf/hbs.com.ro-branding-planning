name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        env:
          # Project site => base path must be "/<repo-name>/".
          # With a custom domain, set BASE_PATH to "/".
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bunx vite build --config vite.config.pages.ts

      - name: Copy media assets into build output
        run: node scripts/fetch-lovable-assets.mjs dist/client

      - name: Verify static media paths
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          test -f dist/client/__l5e/assets-v1/e8edd559-3107-4abe-8074-c9701ba404b6/reparatii-home-1.jpg
          grep -R -q "${BASE_PATH}__l5e/assets-v1/" dist/client

      - name: Disable Jekyll + SPA fallback
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
